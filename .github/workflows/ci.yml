name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Scripts & Configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Syntax-check Python and bootstrap scripts
        run: |
          python -m py_compile scripts/pipeline.py
          python -m py_compile scripts/scan_assets.py
          python -m py_compile scripts/wire_env.py
          python -m py_compile scripts/auto_rig.py
          python -m py_compile scripts/beads_guard.py
          python -m py_compile scripts/run_pipeline_with_bead.py
          bash -n scripts/bootstrap_beads.sh
          pwsh -NoProfile -Command '$errors=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/bootstrap_beads.ps1", [ref]$null, [ref]$errors) | Out-Null; if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }'
          echo "Python, Bash, and PowerShell syntax checks passed"

      - name: Test mandatory Beads enforcement
        run: |
          python -m unittest -v tests/test_beads_guard.py
          set +e
          python scripts/run_pipeline_with_bead.py --bead-id bd-test --batch --character pauli >/tmp/target_conflict.out 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            cat /tmp/target_conflict.out
            echo "ERROR: conflicting --batch and --character targets were accepted"
            exit 1
          fi
          grep -qi "not allowed with argument" /tmp/target_conflict.out || {
            cat /tmp/target_conflict.out
            echo "ERROR: target conflict did not fail at argparse boundary"
            exit 1
          }
          echo "Beads enforcement tests passed"

      - name: Validate Beads governance contract
        run: |
          python - <<'EOF'
          from pathlib import Path
          required = [
              Path("EMERALD_TABLETS_AMENDMENT_01.md"),
              Path("docs/NORTH_STAR.md"),
              Path("docs/BEADS_POLICY.md"),
              Path("scripts/beads_guard.py"),
              Path("scripts/run_pipeline_with_bead.py"),
              Path("scripts/bootstrap_beads.sh"),
              Path("scripts/bootstrap_beads.ps1"),
              Path("tests/test_beads_guard.py"),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("Missing Beads governance files: " + ", ".join(missing))

          policy = Path("docs/BEADS_POLICY.md").read_text(encoding="utf-8")
          north = Path("docs/NORTH_STAR.md").read_text(encoding="utf-8")
          amendment = Path("EMERALD_TABLETS_AMENDMENT_01.md").read_text(encoding="utf-8")
          if "No substantive Yappyverse work exists unless it has a Bead" not in policy:
              raise SystemExit("Beads mandatory policy text missing")
          if "direct outcomes instead of managing tasks" not in north:
              raise SystemExit("North Star contract missing")
          if "Beads is mandatory" not in amendment:
              raise SystemExit("Constitutional Beads amendment missing")
          print("Beads governance contract present")
          EOF

      - name: Validate JSON configs
        run: |
          python - <<'EOF'
          import json, os, sys
          errors = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in [".git", "node_modules", "masf-src2"]]
              for f in files:
                  if f.endswith(".json"):
                      path = os.path.join(root, f)
                      try:
                          with open(path) as fh:
                              json.load(fh)
                      except Exception as e:
                          errors.append(f"{path}: {e}")
          if errors:
              for e in errors:
                  print("ERROR:", e)
              sys.exit(1)
          print("All JSON files valid")
          EOF

      - name: Check required files exist
        run: |
          python - <<'EOF'
          import os, sys
          required = [
              "assets/registry.json",
              "assets/pauli/CHARACTER_CONFIG.json",
              "assets/pauli/manifest.json",
              "scripts/pipeline.py",
              "scripts/auto_rig.py",
              "scripts/scan_assets.py",
              "scripts/graph_config.json",
              ".env.template",
              ".gitignore",
              "README.md",
              "EMERALD_TABLETS_AMENDMENT_01.md",
              "docs/NORTH_STAR.md",
              "docs/BEADS_POLICY.md",
          ]
          missing = [p for p in required if not os.path.exists(p)]
          if missing:
              for m in missing:
                  print("MISSING:", m)
              sys.exit(1)
          print(f"All {len(required)} required files present")
          EOF

      - name: Validate CHARACTER_CONFIG schema
        run: |
          python - <<'EOF'
          import json, sys

          with open("assets/pauli/CHARACTER_CONFIG.json") as f:
              cfg = json.load(f)

          required_keys = ["identity", "palette", "model", "nft"]
          missing = [k for k in required_keys if k not in cfg]
          if missing:
              print("CHARACTER_CONFIG missing keys:", missing)
              print("  Present keys:", list(cfg.keys()))
              sys.exit(1)

          nft = cfg["nft"]
          required_nft_keys = ["card", "metadata", "blockchain"]
          missing_nft = [k for k in required_nft_keys if k not in nft]
          if missing_nft:
              print("nft block missing sub-keys:", missing_nft)
              sys.exit(1)

          print("CHARACTER_CONFIG schema OK:", list(cfg.keys()))
          EOF

      - name: Validate registry covers all char dirs
        run: |
          python - <<'EOF'
          import json, os, sys

          with open("assets/registry.json") as f:
              reg = json.load(f)

          reg_chars = set(reg["characters"].keys())
          disk_chars = {d for d in os.listdir("assets")
                        if os.path.isdir(os.path.join("assets", d))}
          missing_dirs = reg_chars - disk_chars
          if missing_dirs:
              print("Registry chars missing on disk:", missing_dirs)
              sys.exit(1)
          print(f"Registry OK: {len(reg_chars)} characters, all dirs present")
          EOF

  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request' && vars.VERCEL_ENABLED == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Preview to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel deploy --token=$VERCEL_TOKEN --yes 2>&1 | tee /tmp/vercel_out.txt
          DEPLOY_URL=$(grep -Eo 'https://[a-zA-Z0-9._/-]+vercel\.app' /tmp/vercel_out.txt | head -1)
          echo "Preview URL: $DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV

      - name: Comment preview URL on PR
        if: env.DEPLOY_URL != ''
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Vercel Preview\n\n[${process.env.DEPLOY_URL}](${process.env.DEPLOY_URL})`
            })
