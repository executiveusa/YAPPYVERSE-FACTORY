openapi: 3.1.0
info:
  title: YAPPY-CLIPZ Service API
  version: 1.0.0
  description: Stable external contract for shared video-production jobs.
servers:
  - url: https://yappy-clipz.example.com
security:
  - bearerAuth: []
paths:
  /api/v1/projects:
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /api/v1/projects/{project_id}/assets:
    post:
      operationId: addAsset
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssetRequest'
      responses:
        '201':
          description: Asset registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
  /api/v1/projects/{project_id}/jobs:
    post:
      operationId: createJob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '202':
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /api/v1/projects/{project_id}:
    get:
      operationId: getProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /api/v1/projects/{project_id}/outputs:
    get:
      operationId: getOutputs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Project outputs
          content:
            application/json:
              schema:
                type: object
                required: [project_id, outputs]
                properties:
                  project_id: { type: string }
                  outputs:
                    type: array
                    items: { $ref: '#/components/schemas/Output' }
  /api/v1/projects/{project_id}/approve:
    post:
      operationId: approveProject
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved_by]
              properties:
                approved_by: { type: string, minLength: 1 }
                output_id: { type: string }
      responses:
        '200':
          description: Project approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema: { type: string }
  schemas:
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, name]
      properties:
        tenant_id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        brand_profile_id: { type: string }
        metadata: { type: object, additionalProperties: true }
    Project:
      type: object
      required: [id, tenant_id, name, status, created_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        status:
          type: string
          enum: [draft, active, ready, approved, rejected]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AddAssetRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, kind, source_url]
      properties:
        tenant_id: { type: string, minLength: 1 }
        kind:
          type: string
          enum: [video, audio, image, subtitle, logo, other]
        source_url: { type: string, format: uri }
        filename: { type: string }
        checksum_sha256: { type: string, pattern: '^[A-Fa-f0-9]{64}$' }
        metadata: { type: object, additionalProperties: true }
    Asset:
      allOf:
        - $ref: '#/components/schemas/AddAssetRequest'
        - type: object
          required: [id]
          properties:
            id: { type: string }
    CreateJobRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, recipe, source_asset_ids, outputs]
      properties:
        tenant_id: { type: string, minLength: 1 }
        recipe:
          type: string
          enum: [social_reel_v1]
        source_asset_ids:
          type: array
          minItems: 1
          items: { type: string }
        instructions:
          $ref: '#/components/schemas/SocialReelInstructions'
        outputs:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [mp4, capcut]
        idempotency_key: { type: string, minLength: 8 }
    SocialReelInstructions:
      type: object
      additionalProperties: false
      properties:
        duration_seconds: { type: integer, minimum: 5, maximum: 30, default: 30 }
        width: { type: integer, const: 1080 }
        height: { type: integer, const: 1920 }
        captions: { type: boolean, default: true }
        hook: { type: boolean, default: true }
        cta: { type: boolean, default: true }
        platform:
          type: string
          enum: [instagram, tiktok, youtube_shorts, facebook_reels]
        notes: { type: string, maxLength: 4000 }
    Job:
      type: object
      required: [id, project_id, tenant_id, recipe, status, created_at]
      properties:
        id: { type: string }
        project_id: { type: string }
        tenant_id: { type: string }
        recipe: { type: string }
        status:
          type: string
          enum: [queued, analyzing, editing, rendering, qa, ready, approved, failed, rejected, cancelled]
        progress: { type: integer, minimum: 0, maximum: 100 }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Output:
      type: object
      required: [id, kind, status]
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [mp4, capcut, thumbnail, caption_text, metadata]
        status:
          type: string
          enum: [pending, ready, failed]
        url: { type: string, format: uri }
        checksum_sha256: { type: string }
        width: { type: integer }
        height: { type: integer }
        duration_seconds: { type: number }
        verified: { type: boolean }
